# Copy to the repo root. Run `vale sync` once to download the Google package.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = Project

[*.{md,mdx}]
BasedOnStyles = Vale, Google, AISlop
# Google's rules that suit docs written from code. Turn any off here rather than in each file.
Google.Passive = suggestion
Google.Will = warning
Google.Headings = warning
Google.WordList = warning
Google.Contractions = NO
Google.Parens = NO
