services:
  api:
    build: .
    command: python3 -m orderflow.api
    env_file: .env
    ports:
      - "8081:8081"
    volumes:
      - orders:/var/lib/orderflow
  worker:
    build: .
    command: python3 -m orderflow.worker
    env_file: .env
    volumes:
      - orders:/var/lib/orderflow

volumes:
  orders:
