[project]
name = "orderflow"
version = "0.4.2"
description = "Order intake API and payment worker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orderflow = "orderflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
